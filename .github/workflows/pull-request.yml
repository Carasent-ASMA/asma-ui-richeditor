name: Pull request

# ASMA-9048: pull requests previously ran no tests at all, so the ASMA-9047
# dist/style.css guard could only fail when someone ran `pnpm test` locally.
# The guard reads the freshly built artifact, so `pnpm build` must precede
# `pnpm test`; do not cache dist/.
on:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: Build and test
        # Matches the shared reusable workflow family so results are comparable.
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 9
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            # vitest's interaction project runs in real Chromium via Playwright.
            # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD (used by publish.yml) is not enough.
            - name: Install Chromium for Playwright
              run: pnpm exec playwright install --with-deps chromium
            - name: Build
              run: pnpm build
            - name: Test
              run: pnpm test
